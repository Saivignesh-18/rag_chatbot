server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload size for documents (matches backend MAX_FILE_SIZE_MB headroom).
    client_max_body_size 30m;

    # SPA routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (Docker network name: backend).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document ingestion (text extraction + embedding) is synchronous and
        # CPU-bound; a large PDF can take a few minutes. Allow long-running
        # upload requests instead of returning 504 Gateway Timeout.
        proxy_connect_timeout 75s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Basic static caching.
    location ~* \.(js|css|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
