# ============================================================
#  Render Blueprint - AI Document Assistant (RAG chatbot)
#
#  Resources (keep these names in sync with the wiring below):
#    database : rag-db        Postgres + pgvector (enabled by the app on startup)
#    backend  : rag-backend   FastAPI, built from backend/Dockerfile
#    frontend : rag-frontend  React/Vite static site (global CDN)
#
#  IMPORTANT - two URLs must be filled in (they reference each other, so their
#  final values are only known after the services exist). Set them at first
#  deploy using your chosen names, then correct them if Render appended a suffix:
#    backend  CORS_ORIGINS      = https://rag-frontend.onrender.com
#    frontend VITE_API_BASE_URL = https://rag-backend.onrender.com
#  See DEPLOY-RENDER.md for the full walkthrough.
# ============================================================

databases:
  - name: rag-db
    plan: free            # 256 MB / 1 GB disk. NOTE: free Postgres is removed after ~30 days.
    region: oregon
    databaseName: ragdb
    user: raguser

services:
  # ---------------- FastAPI backend (Docker) ----------------
  - type: web
    name: rag-backend
    runtime: docker
    region: oregon        # MUST match the database region for private networking
    plan: free            # 512 MB. The embedding model is CPU/RAM heavy; upgrade to
                          # 1c-2g if indexing large PDFs runs out of memory.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true          # Render mints a strong secret once and keeps it.
      - key: GROQ_API_KEY
        sync: false                  # prompted on first deploy (never commit secrets)
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false                  # = your frontend URL, e.g. https://rag-frontend.onrender.com
      - key: PRIMARY_LLM
        value: groq
      - key: FALLBACK_LLM
        value: gemini
      - key: ENABLE_LLM_FALLBACK
        value: "true"

  # ---------------- React frontend (static site) ----------------
  - type: web
    name: rag-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false                  # = your backend URL, e.g. https://rag-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false                  # your Google OAuth Client ID (public, baked into the build)
    routes:
      # SPA fallback: serve index.html for client-side routes. Render still serves
      # real files (JS/CSS/assets) directly, so this only catches unknown paths.
      - type: rewrite
        source: /*
        destination: /index.html
